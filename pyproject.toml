[project]
name = "ryu-ai"
version = "0.1.0"
description = "Space-Centric Cognitive Architecture (SCCA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
durable = ["psycopg2-binary>=2.9", "redis>=5.0"]
dev = ["pytest>=7.0", "jsonschema>=4.21", "hypothesis>=6.0"]
integration = ["psycopg2-binary>=2.9", "redis>=5.0", "pytest>=7.0", "hypothesis>=6.0"]

[project.scripts]
ryu = "channels.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "core/pulse_bus/tests",
    "core/capabilities/tests",
    "core/plans/tests",
    "core/security/tests",
    "core/space/tests",
    "core/resources/tests",
    "core/orchestrator/tests",
    "agents/tests",
    "llm/tests",
    "workers/tests",
    "node/tests",
    "channels/tests",
    "harness/cases",
    "harness/cases/pulse_bus_integration",
]
pythonpath = ["core/pulse_bus/src", "."]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["core/pulse_bus/src", "."]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "*.tests.*",
    "harness.cases.*",
]
disallow_untyped_defs = false


