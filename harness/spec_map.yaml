  - id: REG-001
    title: "Cryptographic Skill Signature Verification"
    architecture_section: "docs/Architecture §5, §16, ADR-0027"
    acceptance_criterion: >
      Skill registration requires valid cryptographic signature over (skill_id, version, content_hash, risk_tier, registered_by). Invalid signature rejected synchronously.
    contract:
      file: "skills/registry.py"
      rule: "SignatureVerifier.verify() == True required for registration"
    harness_case: "harness/cases/skills/test_skill_supply_chain.py"
    roadmap_phase: 9
    evidence_state: "GATE_VERIFIED"

  - id: REG-002
    title: "Tool Schema Validation at Registration"
